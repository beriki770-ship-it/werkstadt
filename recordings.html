<!-- =========================================================================
     SHELF — one section per project, one card per session
     Built by recordings.js from GET /api/recordings. Empty until the first
     render finishes, which is what #shelf-empty says in plain words rather
     than leaving the page looking broken.
     ========================================================================= -->
<main id="shelf" data-sid="shelf" data-title="Every recorded session, grouped by project, newest first"></main>

<p id="shelf-empty" data-sid="shelf-empty" data-title="Plain-language message while there is nothing on the shelf yet" hidden></p>

<!-- =========================================================================
     TOAST — one line confirming a copied link, bottom centre
     A copy that says nothing is a copy you do twice.
     ========================================================================= -->
<div id="toast" data-sid="toast" data-title="One line confirming a link was copied" role="status" aria-live="polite" hidden></div>
